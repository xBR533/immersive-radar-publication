# IR-023 bounded unattended KINX publication pilot. Gate 2 artifact: NOT installed, NOT enabled, never dispatched.
#
# It does nothing until ALL of these hold (checked on every run by ops/pilot.py, fail closed):
#   * repository variable PUBLICATION_ENABLED is exactly "true"          (owner kill switch)
#   * pilot/authorization.json exists on main and now is inside its window (hard expiry, at most 48 h)
#   * fewer than 3 consecutive failed executions in that window           (GitHub Actions API; uncertainty refuses)
#   * cumulative source objects/bytes and repository bytes stay under the committed ledger budgets
# Per run: at most ONE NOAA object (<= 64 MiB), reserved on main before any object byte is requested.
# Shutdown and recovery: docs/IR023_PILOT_RUNBOOK.md
name: Publish newer KINX observations (IR-023 scheduled pilot)
on:
  schedule:
    - cron: "2-57/5 * * * *"   # every 5 minutes, offset from :00
permissions: {}
concurrency:
  group: publish               # shared with every publication workflow: one writer at a time
  cancel-in-progress: false
env:
  PRODUCER_COMMIT: 2033127495b67eb1a24b4c3190882f0742a120f0   # pipeline identical to the IR-020C pilot pin 87d5a67
  PUBLIC_KEY: beK1btFpakGpYtxipjxr4yKUg+DhKP2Ww9g6pjmHvP8=   # experimental key 888a89015b6da4a7 (unchanged)
  INDEX_URL: https://xbr533.github.io/immersive-radar-publication/kinx/index.json
  PYTHON_VERSION: "3.12.16"

jobs:
  guard:                       # no secrets, read-only token
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      acquire: ${{ steps.guard.outputs.acquire }}
      deploy: ${{ steps.guard.outputs.deploy }}
      stop: ${{ steps.guard.outputs.stop }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { ref: main, persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_ENABLED: ${{ vars.PUBLICATION_ENABLED }}
        run: python -I ops/pilot.py guard   # standard library only

  acquire:                     # signing key + contents:write; no Pages, OIDC or Actions permissions
    needs: guard
    if: needs.guard.outputs.acquire == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    env:
      PYTHONPATH: ${{ github.workspace }}/producer/pipeline
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { ref: main }          # current main, not the trigger snapshot; token kept for the push
      - name: Check out the pinned producer (read-only deploy key)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: xBR533/immersive-radar
          ref: ${{ env.PRODUCER_COMMIT }}
          ssh-key: ${{ secrets.PRODUCER_READ_DEPLOY_KEY }}
          persist-credentials: false
          path: producer
          sparse-checkout: pipeline
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - name: Install hash-pinned dependencies (wheels only)
        run: python -m pip install --disable-pip-version-check --require-hashes --only-binary ':all:' --no-deps -r ops/requirements.lock
      - name: Acquire, produce, sign and publish at most one newer volume
        env:
          SIGNING_KEY: ${{ secrets.IR019B_SIGNING_KEY }}
          PUBLICATION_ENABLED: ${{ vars.PUBLICATION_ENABLED }}
        run: |
          umask 077
          key="$RUNNER_TEMP/signing.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key"
          python ops/pilot.py acquire --signing-key "$key" --work "$RUNNER_TEMP/work"

  stage:                       # no signing key, read-only token. Runs after acquire SUCCEEDED, FAILED or was SKIPPED, so an
                               # already committed, verified publication can always be recovered; it deploys only what
                               # remote main holds after full verification, never the failed run's working files.
    needs: [guard, acquire]
    if: >-
      ${{ !cancelled() && needs.guard.result == 'success' && needs.guard.outputs.deploy == 'true'
          && contains(fromJSON('["success","failure","skipped"]'), needs.acquire.result) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.stage.outputs.deploy }}
      index_sha256: ${{ steps.stage.outputs.index_sha256 }}
    env:
      PYTHONPATH: ${{ github.workspace }}/producer/pipeline
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { ref: main, persist-credentials: false }
      - name: Check out the pinned producer (read-only deploy key)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: xBR533/immersive-radar
          ref: ${{ env.PRODUCER_COMMIT }}
          ssh-key: ${{ secrets.PRODUCER_READ_DEPLOY_KEY }}
          persist-credentials: false
          path: producer
          sparse-checkout: pipeline
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - name: Install hash-pinned dependencies (wheels only)
        run: python -m pip install --disable-pip-version-check --require-hashes --only-binary ':all:' --no-deps -r ops/requirements.lock
      - name: Verify committed main and authenticate the live index; decide deployment
        id: stage
        env:
          PUBLICATION_ENABLED: ${{ vars.PUBLICATION_ENABLED }}
        run: python ops/pilot.py stage --url "$INDEX_URL"
      - name: Archive the verified site
        if: steps.stage.outputs.deploy == 'true'
        run: tar --dereference --hard-dereference --directory site -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
      - if: steps.stage.outputs.deploy == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:                      # Pages + OIDC only; no secrets, no write to the repository
    needs: stage
    if: >-
      ${{ !cancelled() && needs.stage.result == 'success' && needs.stage.outputs.deploy == 'true'
          && vars.PUBLICATION_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { ref: main, persist-credentials: false, sparse-checkout: "ops\npilot" }
      - name: Pre-deployment authorization (kill switch and window, again)
        env:
          PUBLICATION_ENABLED: ${{ vars.PUBLICATION_ENABLED }}
        run: python3 -I ops/pilot.py preflight
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        with: { artifact_name: "pages-${{ github.run_id }}-${{ github.run_attempt }}" }
      - name: Require public visibility of exactly the deployed index (origin and plain URL, 150 s)
        env:
          EXPECTED: ${{ needs.stage.outputs.index_sha256 }}
        run: python3 -I ops/pilot.py probe --url "$INDEX_URL" --expect-sha256 "$EXPECTED"

  stop:                        # the ONLY job with actions:write; no checkout, no secrets
    needs: guard
    if: needs.guard.outputs.stop == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Disable this workflow (convenience; the guard refuses regardless)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/publish-kinx-scheduled.yml/disable"
